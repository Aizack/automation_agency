    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('frant_erp_theme') || 'wabi-sabi-koi';
          var savedScale = localStorage.getItem('frant_erp_scale') || 'comfort';
          var savedFont = localStorage.getItem('frant_erp_font_pair') || 'jakarta';
          document.documentElement.setAttribute('data-theme', savedTheme);
          document.documentElement.setAttribute('data-scale', savedScale);
          document.documentElement.setAttribute('data-font-pair', savedFont);
        } catch (e) {}
      })();
    </script>
